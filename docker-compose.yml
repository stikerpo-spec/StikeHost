services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stikehost
      POSTGRES_USER: stikehost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - stikehost-db:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://stikehost:${POSTGRES_PASSWORD:-change-me-now}@db:5432/stikehost
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-value}
      WORKER_URL: http://worker:4000
      WORKER_SECRET: ${WORKER_SECRET:-worker-secret-change-me}
      PUBLIC_HOST: ${PUBLIC_HOST:-play.stikehost.de}
    depends_on:
      - db
      - worker
    ports:
      - "3000:3000"
  worker:
    build: ./worker
    environment:
      WORKER_SECRET: ${WORKER_SECRET:-worker-secret-change-me}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - stikehost-servers:/srv/stikehost
    expose:
      - "4000"
volumes:
  stikehost-db:
  stikehost-servers:
